<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Three.js Quest Test</title>

    <script src="https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.min.js"></script>
</head>

<body>

<div id="status"
     style="position:fixed;
            top:10px;
            left:10px;
            z-index:1000;
            background:white;
            color:black;
            padding:15px;
            font-family:Arial;
            font-size:20px;">
    JavaScript is working
</div>

<script>

console.log("1. JavaScript started");

const canvas = document.createElement("canvas");

document.body.appendChild(canvas);

console.log("2. Canvas created");

const gl = canvas.getContext("webgl2");

if (!gl) {
    document.getElementById("status").innerHTML =
        "❌ WebGL2 context could NOT be created";
    console.log("WebGL2 FAILED");
} else {

    console.log("3. WebGL2 context created");

    document.getElementById("status").innerHTML =
        "✅ WebGL2 context created";

    gl.clearColor(1.0, 0.0, 0.0, 1.0);

    gl.clear(gl.COLOR_BUFFER_BIT);

    console.log("4. Canvas cleared red");
}

</script>

</body>
</html>
